environment:
  num_envs: 2
  num_threads: 2
  episode_steps: 64
  random_start: true
  healthy_kp: 0.0
  healthy_kd: 0.0
  healthy_pd_limit: 25.0
  residual_scale: 1.0
  exact_baseline: true
  residual_limits: [20.0, 20.0, 8.0, 5.0]
  torque_limits: [260.0, 280.0, 80.0, 15.0]
  fall_height: 0.55
  fall_up_z: 0.35

network:
  units: [64, 64]

ppo:
  seed: 0
  device: cpu
  max_agent_steps: 512
  num_actors: 2
  horizon_length: 64
  minibatch_size: 64
  mini_epochs: 2
  learning_rate: 0.0003
  kl_threshold: 0.02
  gamma: 0.99
  gae_lambda: 0.95
  e_clip: 0.2
  critic_coefficient: 2.0
  entropy_coefficient: 0.0005
  bounds_loss_coefficient: 0.0001
  grad_norm: 1.0
  normalize_input: true
  normalize_value: true
  value_bootstrap: true
  reward_scale: 0.01
  initial_log_std: -3.0
  save_frequency: 1
