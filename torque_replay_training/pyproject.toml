[project]
name = "torque-replay-training"
version = "0.1.0"
description = "Full-body torque replay and independent left-prosthesis PPO training"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "tensorboardX>=2.6.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
